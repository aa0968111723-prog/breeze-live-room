<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>禪譯聽眾</title>
<style>
:root { --bg: #fbf6ee; --fg: #2a2118; --muted: #6b5644; --line: rgba(90, 60, 30, .2); --size: 2.125rem; }
body { margin: 0; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: "Segoe UI", "PingFang TC", sans-serif; }
body.dark { --bg: #16130f; --fg: #f6f1e7; --muted: #d9d0c3; --line: rgba(255, 255, 255, .16); }
body.zh-only .en, body.en-only .zh { display: none; }
body.zh-only .zh, body.en-only .en { font-size: var(--size); color: var(--fg); font-weight: 700; }
header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; min-height: 44px; padding: calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left)); background: var(--bg); background: color-mix(in srgb, var(--bg) 92%, transparent); }
button, select { font-size: 16px; min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 0; background: #8a5424; color: white; }
body.dark button, body.dark select { background: #c9843f; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #c47a32; outline-offset: 2px; }
#state { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); font-weight: 750; }
#settings { margin-left: auto; flex: none; }
.sub { margin: 0; padding: 0 16px 8px; color: var(--muted); font-size: 16px; }
.banner { margin: 0; padding: 10px 16px; background: #8a5424; color: #fff; font-size: 16px; }
#drawer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 16px 12px; }
.stage { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 42vh; padding: 8px 8px 12px; }
.stage-note { margin: 0; padding: 0 20px; min-height: 24px; color: var(--muted); font-size: 16px; }
.stage.idle .en, .stage.idle .zh, .stage.stale .en, .stage.stale .zh { color: var(--muted); font-weight: 650; }
.en { font-size: var(--size); font-weight: 700; padding: 12px 20px 8px; line-height: 1.35; }
.zh { font-size: calc(var(--size) * .62); color: var(--muted); padding: 0 20px 20px; line-height: 1.45; }
ul { list-style: none; margin: 0; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); max-height: 28vh; overflow: auto; }
li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 16px; }
li.gap { color: var(--muted); text-align: center; font-size: 14px; border-top-style: dashed; }
#hist-label { margin: 0 16px; color: var(--muted); font-size: 14px; }
#toast { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); padding: 12px 16px; border-radius: 12px; background: var(--fg); color: var(--bg); font-size: 16px; min-height: 44px; }
#live { position: fixed; right: 12px; bottom: calc(64px + env(safe-area-inset-bottom)); }
@media (prefers-reduced-motion: no-preference) {
  .en, .zh, #toast { transition: opacity .2s; }
}
</style>
</head>
<body>
<header>
<span id="state" role="status" aria-live="polite">連線中</span>
<button id="retry" type="button" hidden>再試一次</button>
<button id="settings" type="button" aria-expanded="false">設定</button>
</header>
<p id="sub" class="sub"></p>
<p id="offline" class="banner" hidden>手機沒網路。恢復網路後會自動接回。</p>
<p id="expiry" class="sub" hidden>較早的字幕已超過保存時間，已從畫面上拿掉</p>
<div id="drawer" hidden>
<button id="theme" type="button">暗色</button>
<button id="full" type="button">全螢幕</button>
<label>顯示 <select id="mode"><option value="both">中英</option><option value="zh">中文</option><option value="en">英文</option></select></label>
<label>字級 <select id="size"><option value="28">小</option><option value="34" selected>中</option><option value="46">大</option></select></label>
<label><input id="pause" type="checkbox"> 暫停跟隨</label>
</div>
<div class="stage" id="stage">
<p id="stage-note" class="stage-note">等待主持人開始</p>
<div class="en" id="en" lang="en"></div>
<div class="zh" id="zh"></div>
</div>
<p id="hist-label">最近字幕</p>
<ul id="history"></ul>
<button id="live" type="button" hidden>回到最新</button>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script type="module">
import { audienceClientId, connectRoom, createCaptionView, liveTail, orderedCaptions } from "/static/room_client.js";
import { GAP_TOAST_MS, HISTORY_DIVIDER, gapCopy, historyStick, stageMode, stageNote } from "/static/room_view.js";
const room = location.pathname.split("/").filter(Boolean).pop();
const listenKey = new URLSearchParams(location.search).get("k") || "";
const clientId = audienceClientId(window.sessionStorage);
const view = createCaptionView(80);
const items = view.items;
const state = { follow: true, pinned: null };
let hostLive = false;
let kind = "connecting";
let lastCaptionAt = 0;
let gapDivider = false;
let pendingReset = false;
let toastTimer = 0;
const en = document.querySelector("#en");
const zh = document.querySelector("#zh");
const history = document.querySelector("#history");
const stage = document.querySelector("#stage");
const stageNoteEl = document.querySelector("#stage-note");
function failed(item) {
  return item && (item.status === "missing" || item.status === "error" || item.status === "timeout" || item.status === "cancelled");
}
function paintChrome() {
  const item = liveTail(items, state.follow, state.pinned);
  const hasCaption = items.size > 0;
  const age = lastCaptionAt ? Date.now() - lastCaptionAt : 0;
  const raw = stageMode({ kind, ageMs: age, hasCaption });
  const mode = !hasCaption && raw === "live" ? "empty" : raw;
  stage.classList.toggle("idle", mode === "idle");
  stage.classList.toggle("stale", mode === "stale" || mode === "ended");
  stageNoteEl.textContent = failed(item) ? "這段沒有字幕" : stageNote(mode, hostLive);
}
function render() {
  const item = liveTail(items, state.follow, state.pinned);
  en.textContent = !item || failed(item) ? "" : (item.en || "");
  zh.textContent = !item || failed(item) ? "" : (item.zh || "");
  const placed = historyStick(history.scrollTop, history.scrollHeight, history.clientHeight, state.follow);
  history.textContent = "";
  if (gapDivider) {
    const mark = document.createElement("li");
    mark.className = "gap";
    mark.textContent = HISTORY_DIVIDER;
    history.appendChild(mark);
  }
  const rows = orderedCaptions(items).slice(-12);
  for (const row of rows) {
    const li = document.createElement("li");
    if (failed(row)) {
      li.textContent = "這段沒有字幕";
    } else if (row.en) {
      li.append(document.createTextNode((row.zh || "") + "　"));
      const english = document.createElement("span");
      english.lang = "en";
      english.textContent = row.en;
      li.append(english);
    } else {
      li.textContent = row.zh || "";
    }
    history.appendChild(li);
  }
  if (placed.stick) history.scrollTop = history.scrollHeight;
  else history.scrollTop = placed.restore;
  document.querySelector("#live").hidden = !!state.follow;
  paintChrome();
}
function show(item) {
  view.apply(item);
  if (!item || (item.type !== "captions_expired" && item.type !== "caption_deleted" && item.type !== "captions_cleared")) {
    const note = document.querySelector("#expiry");
    if (note) note.hidden = true;
  }
  render();
}
function showToast(text) {
  const toast = document.querySelector("#toast");
  toast.hidden = false;
  toast.textContent = text;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, GAP_TOAST_MS);
}
let conn = connect();
function connect() {
  return connectRoom({
    room,
    url: () => {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      let address = proto + "://" + location.host + "/ws/listen?room_id=" + encodeURIComponent(room);
      if (listenKey) address += "&k=" + encodeURIComponent(listenKey);
      if (clientId) address += "&cid=" + encodeURIComponent(clientId);
      return address;
    },
    onState: (detail) => {
      const text = detail && typeof detail === "object" ? (detail.text || "") : String(detail || "");
      const subtitle = detail && typeof detail === "object" ? (detail.subtitle || "") : "";
      kind = detail && typeof detail === "object" ? (detail.kind || "") : "";
      document.querySelector("#state").textContent = text;
      const sub = document.querySelector("#sub");
      if (sub) sub.textContent = subtitle;
      const offline = document.querySelector("#offline");
      if (offline) offline.hidden = kind !== "device_offline";
      const retry = document.querySelector("#retry");
      if (retry) {
        const showRetry = !!(detail && typeof detail === "object" && (
          detail.manual || kind === "link_invalid" || kind === "unreachable" ||
          kind === "room_full" || kind === "ended" || kind === "rejected"
        ));
        retry.hidden = !showRetry;
      }
      paintChrome();
    },
    onEvent: (item) => { lastCaptionAt = Date.now(); show(item); },
    onDelete: show,
    onExpire: () => {
      const note = document.querySelector("#expiry");
      if (!note) return;
      note.hidden = false;
      note.textContent = "較早的字幕已超過保存時間，已從畫面上拿掉";
    },
    onClear: (data) => { view.apply(data && data.type ? data : { type: "captions_cleared" }); render(); },
    onBackfill: (rows) => { view.replace(rows); lastCaptionAt = Date.now(); render(); },
    onReset: () => {
      view.reset();
      pendingReset = true;
      gapDivider = false;
      queueMicrotask(() => {
        if (!pendingReset) return;
        pendingReset = false;
        showToast(gapCopy(true));
        render();
      });
    },
    onGap: () => {
      gapDivider = true;
      const reset = pendingReset;
      pendingReset = false;
      showToast(gapCopy(reset));
      render();
    },
    onHost: (detail) => {
      hostLive = !!(detail && detail.live);
      paintChrome();
    },
  });
}
document.querySelector("#retry").onclick = () => { conn.restart(); };
document.querySelector("#settings").onclick = () => {
  const drawer = document.querySelector("#drawer");
  drawer.hidden = !drawer.hidden;
  document.querySelector("#settings").setAttribute("aria-expanded", drawer.hidden ? "false" : "true");
};
document.querySelector("#theme").onclick = () => {
  document.body.classList.toggle("dark");
  document.querySelector("#theme").textContent = document.body.classList.contains("dark") ? "亮色" : "暗色";
};
const full = document.querySelector("#full");
if (!document.fullscreenEnabled) full.hidden = true;
full.onclick = () => {
  const request = !document.fullscreenElement
    ? document.documentElement.requestFullscreen()
    : document.exitFullscreen();
  if (request && typeof request.catch === "function") request.catch(() => {});
};
document.querySelector("#mode").onchange = (ev) => {
  document.body.classList.remove("zh-only", "en-only");
  if (ev.target.value === "zh") document.body.classList.add("zh-only");
  if (ev.target.value === "en") document.body.classList.add("en-only");
};
document.querySelector("#size").onchange = (ev) => { document.documentElement.style.setProperty("--size", ev.target.value + "px"); };
document.querySelector("#pause").onchange = (ev) => {
  state.follow = !ev.target.checked;
  if (!state.follow) state.pinned = liveTail(items, true) && liveTail(items, true).id;
  render();
};
document.querySelector("#live").onclick = () => {
  state.follow = true;
  state.pinned = null;
  document.querySelector("#pause").checked = false;
  render();
};
document.querySelector("#toast").onclick = () => { document.querySelector("#toast").hidden = true; };
history.addEventListener("scroll", () => {
  const distance = history.scrollHeight - history.scrollTop - history.clientHeight;
  if (distance > 48 && state.follow) {
    state.follow = false;
    const pause = document.querySelector("#pause");
    if (pause) pause.checked = true;
    document.querySelector("#live").hidden = false;
  }
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") conn.nudge(); });
setInterval(paintChrome, 1000);
paintChrome();
</script>
</body>
</html>
