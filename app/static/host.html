<!doctype html>
<meta charset="utf-8">
<title>禪譯聽眾房</title>
<style>
body{font-family:sans-serif;margin:24px;background:#f6f1e7;color:#2b241c}
button{font-size:18px;padding:10px 16px;margin-right:8px}
#log{white-space:pre-wrap;background:#fff;padding:12px;min-height:220px}
.warn{color:#8a3b12}
</style>
<h1>禪譯聽眾房</h1>
<p>電腦聽中文，手機平板掃 QR 看英文。</p>
<label>房間 <input id="room" value="class"></label>
<button id="go">開始聽</button>
<button id="stop" disabled>停止</button>
<p id="status"></p>
<img id="qr" alt="QR" width="220">
<p id="url"></p>
<div id="log"></div>
<script>
const roomEl=document.querySelector('#room'), log=document.querySelector('#log'), status=document.querySelector('#status');
let rec, timer, stream;
function line(text){ log.textContent=text+'\n'+log.textContent; }
async function setup(){
  const data=await fetch('/api/setup?room_id='+encodeURIComponent(roomEl.value)).then(r=>r.json());
  document.querySelector('#qr').src='/api/qr?room_id='+encodeURIComponent(roomEl.value)+'&t='+Date.now();
  document.querySelector('#url').textContent=data.listen_url;
  const missing=[];
  if(!data.whisper) missing.push('whisper-cli.exe');
  if(!data.model) missing.push('模型');
  if(!data.ffmpeg) missing.push('ffmpeg');
  status.className=missing.length?'warn':'';
  status.textContent=missing.length?('還缺：'+missing.join('、')):(data.translate?'可以開聽，英譯已開':'可以開聽，尚未設 OPENAI_API_KEY，聽眾只會看到中文');
}
roomEl.onchange=setup; setup();
document.querySelector('#go').onclick=async()=>{
  stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
  rec=new MediaRecorder(stream,{mimeType:mime});
  rec.ondataavailable=async ev=>{
    if(!ev.data || ev.data.size<800) return;
    const body=new FormData();
    body.append('room_id', roomEl.value||'class');
    body.append('audio', ev.data, 'chunk.webm');
    const data=await fetch('/api/push',{method:'POST',body}).then(r=>r.json());
    if(!data.ok){ line('失敗：'+(data.detail||'辨識失敗')); return; }
    line((data.en||'(尚無英譯)')+'\n'+data.zh);
  };
  rec.start();
  timer=setInterval(()=>{ if(rec && rec.state==='recording'){ rec.requestData(); rec.stop(); rec.start(); } }, 6000);
  document.querySelector('#stop').disabled=false;
  line('開始聽了。每 6 秒送一段。');
};
document.querySelector('#stop').onclick=()=>{
  clearInterval(timer);
  if(rec && rec.state!=='inactive') rec.stop();
  stream?.getTracks().forEach(t=>t.stop());
  document.querySelector('#stop').disabled=true;
};
</script>
