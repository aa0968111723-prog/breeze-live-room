name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-lock.txt -r requirements-dev.txt
      - run: python -m pytest
      - run: node tests/recorder_machine.test.mjs
      - run: node tests/room_client.test.mjs
      - name: Verify clean one-click installation and real inference
        shell: pwsh
        env:
          BREEZE_NONINTERACTIVE: '1'
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Breeze release 測試'
          New-Item -ItemType Directory -Force $target | Out-Null
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Copy-Item -Destination $target -Recurse
          Push-Location $target
          try {
            cmd /c install.bat
            if ($LASTEXITCODE) { throw 'Installation failed' }
            cmd /c verify.bat
            if ($LASTEXITCODE) { throw 'Inference failed' }
          } finally { Pop-Location }
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne ('v' + (Get-Content VERSION -Raw).Trim())) { throw 'Tag and VERSION differ' }
      - run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Breeze-Windows-installer
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-inference-report
          path: ${{ runner.temp }}/Breeze release 測試/data/runtime-check.json
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Breeze-Windows-installer
          path: dist
      - name: Publish verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Breeze Live Room $GITHUB_REF_NAME" --generate-notes
